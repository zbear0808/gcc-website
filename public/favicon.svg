<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Left handle -->
  <path d="M16,32 Q10,36 9,44 Q8,52 14,54 Q20,56 22,48 Q23,42 20,34 Z" fill="#5e5e5e"/>
  
  <!-- Right handle -->
  <path d="M48,32 Q54,36 55,44 Q56,52 50,54 Q44,56 42,48 Q41,42 44,34 Z" fill="#5e5e5e"/>
  
  <!-- Main body -->
  <rect x="10" y="14" width="44" height="24" rx="12" fill="#6b6b6b"/>
  
  <!-- Cable -->
  <rect x="29" y="4" width="6" height="12" rx="3" fill="#444"/>
  
  <!-- Left trigger -->
  <rect x="13" y="11" width="11" height="5" rx="2.5" fill="#888"/>
  
  <!-- Right trigger -->
  <rect x="40" y="11" width="11" height="5" rx="2.5" fill="#888"/>
  
  <!-- Left stick (gate + stick) -->
  <circle cx="24" cy="24" r="7" fill="#555" stroke="#4a4a4a" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="3.5" fill="#6a6a6a"/>
  
  <!-- D-pad -->
  <rect x="19" y="33.5" width="9" height="3" rx="0.8" fill="#555"/>
  <rect x="22" y="31" width="3" height="8" rx="0.8" fill="#555"/>
  
  <!-- A button (green, large) -->
  <circle cx="44" cy="25" r="4.5" fill="#4ecca3"/>
  
  <!-- B button (red, small, lower-left of A) -->
  <circle cx="37.5" cy="29" r="2.5" fill="#e05555"/>
  
  <!-- X button (horizontal pill, right of A) -->
  <rect x="48" y="20" width="6" height="3" rx="1.5" fill="#999"/>
  
  <!-- Y button (vertical pill, above-left of A) -->
  <rect x="39.5" y="17" width="3" height="6" rx="1.5" fill="#999"/>
  
  <!-- C-stick (yellow, small) -->
  <circle cx="44" cy="35" r="3" fill="#ccaa00" stroke="#aa8800" stroke-width="0.8"/>
  <circle cx="44" cy="35" r="1.5" fill="#ddbb22"/>
</svg>
