name: Build and Deploy

# Controls when the action will run. Triggers the workflow on push
# events but only for the master branch
on:
  push:
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-and-deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4
    
    # Setup Java 21 (required for Clojure)
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    
    # Setup Clojure CLI
    - uses: DeLaGuardo/setup-clojure@13.4
      with:
        cli: '1.12.0.1530'
    
    # Setup Node.js environment
    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 24

    # Install npm dependencies
    - name: Install dependencies
      run: npm ci

    # Build the ClojureScript application
    - name: Build application
      run: npm run build

    # Optional: Run tests
    # Uncomment the following lines if you want to run tests in CI
    # - name: Run tests
    #   run: npm run test

    # Deploy to separate repository
    - name: Deploy to deploy repo
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      run: |
        # Configure git
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Clone deploy repo
        git clone https://x-access-token:${DEPLOY_TOKEN}@github.com/zbear0808/zulaser-deploy.git deploy-repo
        
        # Clear old build files and create fresh public directory
        cd deploy-repo
        rm -rf public
        mkdir public
        
        # Copy built public folder contents into public subdirectory
        cp -r ../public/* public/
        
        # Commit and push if there are changes
        git add -A
        if ! git diff --staged --quiet; then
          git commit -m "Deploy: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin main
        else
          echo "No changes to deploy"
        fi
